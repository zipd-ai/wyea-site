<form id="contact-form">
  <p class="form-intro">Prefer to write? We reply within one business day.</p>
  <div class="field-row">
    <label class="field"><span>Your name</span>
      <input type="text" name="name" autocomplete="name" maxlength="200" required>
    </label>
    <label class="field"><span>Firm <span class="optional">(optional)</span></span>
      <input type="text" name="firm" autocomplete="organization" maxlength="200">
    </label>
  </div>
  <label class="field"><span>Email</span>
    <input type="email" name="email" autocomplete="email" maxlength="254" required>
  </label>
  <label class="field"><span>How can we help?</span>
    <textarea name="message" rows="5" maxlength="5000" required></textarea>
  </label>
  <label class="hp" aria-hidden="true">Website
    <input type="text" name="website" tabindex="-1" autocomplete="off">
  </label>
  <div class="cf-turnstile" hidden></div>
  <button type="submit" class="btn btn-light">Send message</button>
  <p class="form-status" role="status" aria-live="polite"></p>
</form>
<p id="contact-success" class="contact-success" hidden>
  Thanks. Your message is on its way. We'll reply within one business day.
</p>
